<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Pandora — doorway people counter</title>
  <desc id="desc">An illustrated overhead camera observes two people walking through a doorway.</desc>
  <rect width="1200" height="340" rx="16" fill="#f3f0e8"/>
  <path d="M0 285H1200" stroke="#d6d2c7" stroke-width="2"/>
  <text x="72" y="92" fill="#55736d" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">DOORWAY PEOPLE COUNTER</text>
  <text x="68" y="160" fill="#283d43" font-family="Georgia, serif" font-size="67" font-weight="700">Pandora</text>
  <path d="M73 184h64" stroke="#bd765c" stroke-width="4" stroke-linecap="round"/>
  <text x="72" y="224" fill="#536365" font-family="Arial, sans-serif" font-size="20">A clearer picture of people moving</text>
  <text x="72" y="253" fill="#536365" font-family="Arial, sans-serif" font-size="20">through a shared space.</text>
