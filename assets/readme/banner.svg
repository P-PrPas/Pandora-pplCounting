<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Pandora doorway people counter</title>
  <desc id="desc">A doorway with two crossing zones and tracked paths, illustrating people counting.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b35"/><stop offset="1" stop-color="#172c47"/></linearGradient>
    <linearGradient id="line" x2="1" y2="0"><stop stop-color="#61d8cd"/><stop offset="1" stop-color="#779cff"/></linearGradient>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <path d="M0 270H1200M0 180H1200M0 90H1200M150 0V340M300 0V340M450 0V340M600 0V340M750 0V340M900 0V340M1050 0V340" stroke="#fff" stroke-opacity=".035"/>
  <text x="70" y="102" fill="#71ded3" font-family="Arial,sans-serif" font-size="15" font-weight="bold" letter-spacing="4">COMPUTER VISION / PEOPLE COUNTING</text>
  <text x="70" y="170" fill="#fff" font-family="Arial,sans-serif" font-size="58" font-weight="bold" letter-spacing="2">PANDORA</text>
  <text x="72" y="211" fill="#bdcce0" font-family="Arial,sans-serif" font-size="22">See movement. Understand flow.</text>
  <path d="M72 250h215" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(780 35)">
    <path d="M45 205 188 260 335 205 190 157Z" fill="#5de0cf" fill-opacity=".15" stroke="#70e4d7" stroke-opacity=".7" stroke-width="2"/>
    <path d="M45 205 45 105 190 50 335 105 335 205" fill="none" stroke="#8ba9cf" stroke-opacity=".45" stroke-width="2"/>
    <path d="M190 50v107M45 105l145 52 145-52" fill="none" stroke="#8ba9cf" stroke-opacity=".35" stroke-width="2"/>
    <path d="M126 218c18-34 44-55 74-79" fill="none" stroke="#74e3d7" stroke-width="3" stroke-dasharray="7 8"/>
    <path d="m190 140 12-4-3 13" fill="none" stroke="#74e3d7" stroke-width="3"/>
    <circle cx="126" cy="218" r="7" fill="#74e3d7"/><circle cx="200" cy="139" r="7" fill="#91adff"/>
    <text x="72" y="196" fill="#b9e9e5" font-family="Arial,sans-serif" font-size="14" font-weight="bold">ZONE A</text>
    <text x="240" y="194" fill="#c4d0ff" font-family="Arial,sans-serif" font-size="14" font-weight="bold">ZONE B</text>
  </g>
</svg>
