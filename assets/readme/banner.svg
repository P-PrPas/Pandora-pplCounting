    <path d="m916 189-13 30m40-30 12 29" fill="none" stroke-width="7"/>
    <circle cx="929" cy="157" r="15" fill="#d7a483"/>
    <path d="M914 154q0-18 15-18t16 18q-15-3-21-9-3 7-10 9z" fill="#405052" stroke-width="2"/>
