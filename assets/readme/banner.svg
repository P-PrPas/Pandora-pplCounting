  <path d="M838 70V45h68v25" fill="#eee9dd" stroke="#405a5a" stroke-width="3"/>
  <rect x="846" y="39" width="52" height="25" rx="8" fill="#405a5a"/>
  <circle cx="872" cy="51" r="6" fill="#c5dcd2"/>
  <path d="M859 64 794 228M885 64l65 164" stroke="#819d91" stroke-width="2" stroke-dasharray="6 7"/>
  <!-- Two people in a restrained editorial illustration style -->
  <g stroke="#405052" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M803 252l-10 34m25-34 13 34" fill="none" stroke-width="8"/>
